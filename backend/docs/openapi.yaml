    PayloadTooLarge:
      description: JSON body exceeds the 100kb limit.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Locked:
      description: The PIN is locked after five failed attempts.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: Rate limit exceeded. Rate-limit state is in memory and per instance.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Unexpected server error. Stack traces are not returned.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
