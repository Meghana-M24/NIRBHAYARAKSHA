            verified:
              type: boolean
              enum: [true]

    SosTriggerResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [message, event, notifications]
          properties:
            message:
              type: string
              example: SOS triggered
            event:
              $ref: '#/components/schemas/SosEvent'
            notifications:
              $ref: '#/components/schemas/NotificationSummary'

    SosListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [events, pagination]
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/SosEvent'
            pagination:
              $ref: '#/components/schemas/Pagination'

    SosEventResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [event]
          properties:
            event:
              $ref: '#/components/schemas/SosEvent'

    SosCancelResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [message, event]
          properties:
            message:
              type: string
              example: SOS cancelled
            event:
              $ref: '#/components/schemas/SosEvent'

    NotificationListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [notifications, count]
          properties:
            notifications:
              type: array
              items:
                $ref: '#/components/schemas/EmergencyNotification'
            count:
              type: integer
              minimum: 0

    SafetyTimerResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [timer]
          properties:
            timer:
              $ref: '#/components/schemas/SafetyTimer'

    SafetyTimerActionResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [message, timer]
          properties:
            message:
              type: string
              example: Safety timer started
            timer:
              $ref: '#/components/schemas/SafetyTimer'

    LocationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [location]
          properties:
            location:
              $ref: '#/components/schemas/Location'

    LocationUpdateResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [message, location]
          properties:
            message:
              type: string
              example: Location updated
            location:
              $ref: '#/components/schemas/Location'

    MessageResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: Location share revoked

    LocationShareResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [message, share]
          properties:
            message:
              type: string
              example: Location share created
            share:
              $ref: '#/components/schemas/LocationShareCreated'

    PublicLocationShareResponse:
