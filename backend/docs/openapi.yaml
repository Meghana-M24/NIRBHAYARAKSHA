            user:
              $ref: '#/components/schemas/User'

    ContactListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [contacts]
          properties:
            contacts:
              type: array
              items:
                $ref: '#/components/schemas/Contact'

    ContactResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [contact]
          properties:
            contact:
              $ref: '#/components/schemas/Contact'

    DeleteContactResponse:
