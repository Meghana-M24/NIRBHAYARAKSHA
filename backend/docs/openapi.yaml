openapi: 3.0.3

info:
  title: NIRBHAYARAKSHA Backend API
  version: 1.0.0
  description: |
    Machine-readable contract for the NIRBHAYARAKSHA backend.

    Important behavior:

    - Protected routes require `Authorization: Bearer <JWT>`. The token is
      returned by `POST /api/auth/login`.
    - `GET /api/health` and `GET /api/location/share/{token}` are public.
    - SOS notifications are **simulated**. No real SMS message is sent.
    - Successful responses use `{ "success": true, "data": ... }`.
    - Error responses use `{ "success": false, "message": ... }` and may add
      `attemptsRemaining` or `retryAfterSeconds`.
    - API responses include `X-Request-ID` and `Cache-Control: no-store`.
    - Ownership failures return `404` rather than `403`.
    - Plaintext passwords and PINs are never returned.
    - Rate limits are stored in process memory and are per instance.
    - JSON bodies are limited to `100kb`.

    This specification is maintained alongside `backend/docs/API.md`.
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt

servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://api.example.com
    description: Production placeholder; replace with the deployed API origin

tags:
  - name: Health
    description: Liveness checks.
  - name: Authentication
    description: Registration, login, and profile management.
  - name: Trusted contacts
    description: Contacts notified during an SOS or safety-timer expiry.
  - name: PIN
    description: Normal PIN, duress PIN, and lockout behavior.
  - name: SOS
    description: Emergency events and simulated notification records.
  - name: Safety timer
    description: Timed check-ins that can escalate to an SOS event.
  - name: Location
    description: Latest private location for the current user.
  - name: Location sharing
    description: Public, expiring location-share links.

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      description: Public. Returns process uptime without querying MongoDB.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthSuccess'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an account
      description: |
        Creates an account. The email is normalized to lowercase and must be
        unique. The password is hashed with bcrypt and never returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in
      description: Returns a Bearer JWT and the safe user object.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getMe
      summary: Get the current user
      description: Returns the authenticated user's safe profile.
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Authentication]
      operationId: updateMe
      summary: Update the current user
      description: |
        Updates any combination of `name`, `phone`, `address`, and
        `emergencyInfo`. At least one recognized field is required. Unknown
        fields are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/contacts:
    get:
      tags: [Trusted contacts]
      operationId: listContacts
      summary: List trusted contacts
      description: Returns the current user's contacts, oldest first.
      responses:
        '200':
          $ref: '#/components/responses/ContactListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Trusted contacts]
      operationId: createContact
      summary: Create a trusted contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '201':
          $ref: '#/components/responses/ContactSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/contacts/{id}:
    patch:
      tags: [Trusted contacts]
      operationId: updateContact
      summary: Update a trusted contact
      description: |
        Updates any combination of `name`, `phone`, and `relationship`.
        At least one recognized field is required.
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
      responses:
        '200':
          $ref: '#/components/responses/ContactSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Trusted contacts]
      operationId: deleteContact
      summary: Delete a trusted contact
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          $ref: '#/components/responses/ContactDeletedSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/pin/setup:
    post:
      tags: [PIN]
      operationId: setupPin
      summary: Set the PIN for the first time
      description: Requires the account password. Returns `409` if a PIN is already set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupPinRequest'
      responses:
        '201':
          $ref: '#/components/responses/PinActionSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/pin/verify:
    post:
      tags: [PIN]
      operationId: verifyPin
      summary: Verify the PIN
      description: |
        Returns the same success response for the normal PIN and the duress PIN.
        Five failed attempts lock the PIN for 15 minutes. This route has a
        dedicated limit of 10 requests per 15 minutes per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPinRequest'
      responses:
        '200':
          $ref: '#/components/responses/PinVerifySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/pin:
    patch:
      tags: [PIN]
      operationId: changePin
      summary: Change the PIN
      description: |
        Requires the account password; the current PIN is not required.

        Duress PIN behavior:

        - Omit `duressPin` to keep the existing duress PIN.
        - Send `null` or an empty string to remove it.
        - Send a 4-digit string to replace it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePinRequest'
      responses:
        '200':
          $ref: '#/components/responses/PinActionSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sos:
    get:
      tags: [SOS]
      operationId: listSosEvents
      summary: List SOS history
      description: Returns SOS events for the current user, newest first.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/SosListSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [SOS]
      operationId: triggerSos
      summary: Trigger an SOS event
      description: |
        Creates an SOS event, snapshots trusted contacts, and creates simulated
        notification records. The duress flag is never returned to the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerSosRequest'
      responses:
        '201':
          $ref: '#/components/responses/SosTriggerSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sos/{id}:
    get:
      tags: [SOS]
      operationId: getSosEvent
      summary: Get one SOS event
      parameters:
        - $ref: '#/components/parameters/SosEventId'
      responses:
        '200':
          $ref: '#/components/responses/SosEventSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sos/{id}/cancel:
    patch:
      tags: [SOS]
      operationId: cancelSosEvent
      summary: Cancel an SOS event
      description: Only events with status `active` can be cancelled.
      parameters:
        - $ref: '#/components/parameters/SosEventId'
      responses:
        '200':
          $ref: '#/components/responses/SosCancelSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sos/{id}/notifications:
    get:
      tags: [SOS]
      operationId: listSosNotifications
      summary: List notification records for an SOS event
      description: |
        Returns simulated notification records. Raw contact phone numbers are
        masked. No real SMS message is sent.
      parameters:
        - $ref: '#/components/parameters/SosEventId'
      responses:
        '200':
          $ref: '#/components/responses/NotificationListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/safety-timer:
    get:
      tags: [Safety timer]
      operationId: getActiveSafetyTimer
      summary: Get the active safety timer
      responses:
        '200':
          $ref: '#/components/responses/SafetyTimerSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Safety timer]
      operationId: startSafetyTimer
      summary: Start a safety timer
      description: |
        Requires the PIN. Only one active timer is allowed per user. Trusted
        contacts are snapshotted when the timer starts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSafetyTimerRequest'
      responses:
        '201':
          $ref: '#/components/responses/SafetyTimerActionSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/safety-timer/check-in:
    patch:
      tags: [Safety timer]
      operationId: checkInSafetyTimer
      summary: Check in on the active safety timer
      description: Does not require a PIN. It does not accept a request body.
      responses:
        '200':
          $ref: '#/components/responses/SafetyTimerActionSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/location:
    get:
      tags: [Location]
      operationId: getMyLocation
      summary: Get the latest location
      responses:
        '200':
          $ref: '#/components/responses/LocationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Location]
      operationId: updateMyLocation
      summary: Save the latest location
      description: Saves or replaces the current user's latest location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '200':
          $ref: '#/components/responses/LocationUpdateSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Location]
      operationId: deleteMyLocation
      summary: Delete the latest location
      responses:
        '200':
          $ref: '#/components/responses/MessageSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/location/share:
    post:
      tags: [Location sharing]
      operationId: createLocationShare
      summary: Create or replace the active location share
      description: |
        The user must have a saved location. Creating a new share invalidates
        the previous share. The raw token is returned only once; only its
        SHA-256 hash is stored.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationShareRequest'
      responses:
        '201':
          $ref: '#/components/responses/LocationShareSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Location sharing]
      operationId: revokeLocationShare
      summary: Revoke the active location share
      responses:
        '200':
          $ref: '#/components/responses/MessageSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/location/share/{token}:
    get:
      tags: [Location sharing]
      operationId: getSharedLocation
      summary: View a public location share
      description: |
        Public. Returns only the owner's name, latest location, and expiry.
        It does not return email, phone, user ID, or credential data.
      security: []
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          $ref: '#/components/responses/PublicLocationShareSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT returned by `POST /api/auth/login`. Send it as
        `Authorization: Bearer <JWT>`.

  headers:
    X-Request-ID:
      description: |
        Correlation ID. A valid incoming value is reused; otherwise the server
        generates a UUID.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'
        example: 0f8fad5b-d9cb-469f-a165-70867728950e
    Cache-Control:
      description: API responses are never cached.
      schema:
        type: string
        enum: [no-store]
    RateLimit-Policy:
      description: Rate-limit policy in IETF draft format.
      schema:
        type: string
        example: 300;w=900
    RateLimit-Limit:
      description: Request quota for the current window.
      schema:
        type: integer
        example: 300
    RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        minimum: 0
        example: 299
    RateLimit-Reset:
      description: Seconds until the current window resets.
      schema:
        type: integer
        minimum: 0
        example: 900
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
        example: 900

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ContactId:
      name: id
      in: path
      required: true
      description: Contact identifier. Invalid ObjectIds return 404.
      schema:
        type: string
        example: 665f1d3b9b1e8a0012a34568
    SosEventId:
      name: id
      in: path
      required: true
      description: SOS event identifier. Invalid ObjectIds return 404.
      schema:
        type: string
        example: 665f1e4c9b1e8a0012a34569
    ShareToken:
      name: token
      in: path
      required: true
      description: 64-character lowercase hexadecimal share token.
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
        example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      additionalProperties: true
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Asha Rao
        email:
          type: string
          format: email
          maxLength: 254
          example: asha@example.com
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          description: |
            At least 8 characters and at most 72 UTF-8 bytes. The API enforces
            the byte limit; this schema cannot express bytes directly.
          example: StrongPass123!

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: true
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: asha@example.com
        password:
          type: string
          format: password
          writeOnly: true

    UpdateProfileRequest:
      type: object
      additionalProperties: true
      anyOf:
        - required: [name]
        - required: [phone]
        - required: [address]
        - required: [emergencyInfo]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Cannot be empty or whitespace-only.
        phone:
          type: string
          maxLength: 20
        address:
          type: string
          maxLength: 300
        emergencyInfo:
          type: string
          maxLength: 1000

    CreateContactRequest:
      type: object
      required: [name, phone, relationship]
      additionalProperties: true
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Ravi Rao
        phone:
          type: string
          pattern: '^[0-9]{10}$'
          example: '9876543210'
        relationship:
          type: string
          example: Family
          description: |
            One of Family, Friend, Relative, Colleague, or Other.
            Input is case-insensitive and normalized to the canonical value.

    UpdateContactRequest:
      type: object
      additionalProperties: true
      anyOf:
        - required: [name]
        - required: [phone]
        - required: [relationship]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Cannot be empty or whitespace-only.
        phone:
          type: string
          pattern: '^[0-9]{10}$'
        relationship:
          type: string
          description: |
            One of Family, Friend, Relative, Colleague, or Other.
            Input is case-insensitive and normalized to the canonical value.

    SetupPinRequest:
      type: object
      required: [password, pin]
      additionalProperties: true
      properties:
        password:
          type: string
          format: password
          writeOnly: true
        pin:
          type: string
          pattern: '^[0-9]{4}$'
          writeOnly: true
          example: '1234'
        duressPin:
          type: string
          nullable: true
          pattern: '^([0-9]{4})?$'
          writeOnly: true
          description: |
            Optional. If set, it must be exactly 4 digits and must differ from
            the normal PIN. `null` or an empty string means no duress PIN.

    VerifyPinRequest:
      type: object
      required: [pin]
      additionalProperties: true
      properties:
        pin:
          type: string
          pattern: '^[0-9]{4}$'
          writeOnly: true

    ChangePinRequest:
      type: object
      required: [password, pin]
      additionalProperties: true
      properties:
        password:
          type: string
          format: password
          writeOnly: true
        pin:
          type: string
          pattern: '^[0-9]{4}$'
          writeOnly: true
        duressPin:
          type: string
          nullable: true
          pattern: '^([0-9]{4})?$'
          writeOnly: true
          description: |
            Omit to keep the existing duress PIN. Send `null` or an empty string
            to remove it. Send 4 digits to replace it.

    LocationInput:
      type: object
      required: [latitude, longitude]
      additionalProperties: true
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 28.6139
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 77.209
        accuracy:
          type: number
          minimum: 0
          nullable: true
          example: 12.5

    TriggerSosRequest:
      type: object
      required: [pin]
      additionalProperties: true
      properties:
        pin:
          type: string
          pattern: '^[0-9]{4}$'
          writeOnly: true
        location:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocationInput'
        message:
          type: string
          nullable: true
          maxLength: 500
          example: Please help me

    StartSafetyTimerRequest:
      type: object
      required: [pin, durationMinutes]
      additionalProperties: true
      properties:
        pin:
          type: string
          pattern: '^[0-9]{4}$'
          writeOnly: true
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          example: 30
        message:
          type: string
          nullable: true
          maxLength: 500
          example: Check on me

    CreateLocationShareRequest:
      type: object
      additionalProperties: true
      properties:
        expiresInMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 60
          nullable: true
          description: Optional. Defaults to 60 minutes.

    User:
      type: object
      required:
        - _id
        - name
        - email
        - phone
        - address
        - emergencyInfo
        - pinConfigured
        - failedPinAttempts
        - pinLockedUntil
        - lastLoginAt
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        _id:
          type: string
          example: 665f1c2a9b1e8a0012a34567
        name:
          type: string
          maxLength: 100
          example: Asha Rao
        email:
          type: string
          format: email
          maxLength: 254
          example: asha@example.com
        phone:
          type: string
          maxLength: 20
          example: '9876543210'
        address:
          type: string
          maxLength: 300
          example: Delhi
        emergencyInfo:
          type: string
          maxLength: 1000
          example: Call my brother
        pinConfigured:
          type: boolean
          example: true
        failedPinAttempts:
          type: integer
          minimum: 0
          example: 0
        pinLockedUntil:
          type: string
          format: date-time
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Contact:
      type: object
      required:
        - _id
        - name
        - phone
        - relationship
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          example: 665f1d3b9b1e8a0012a34568
        name:
          type: string
          maxLength: 100
          example: Ravi Rao
        phone:
          type: string
          pattern: '^[0-9]{10}$'
          example: '9876543210'
        relationship:
          type: string
          enum: [Family, Friend, Relative, Colleague, Other]
          example: Family
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SosLocation:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 28.6139
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 77.209
        accuracy:
          type: number
          minimum: 0
          nullable: true
          example: 12.5

    SosEvent:
      type: object
      required:
        - id
        - status
        - triggeredAt
        - cancelledAt
        - hasLocation
        - location
        - message
        - contactCount
      properties:
        id:
          type: string
          example: 665f1e4c9b1e8a0012a34569
        status:
          type: string
          enum: [active, cancelled, resolved]
          example: active
        triggeredAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        hasLocation:
          type: boolean
        location:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SosLocation'
        message:
          type: string
          maxLength: 500
          example: Please help me
        contactCount:
          type: integer
          minimum: 0
          example: 1

    EmergencyNotification:
      type: object
      required:
        - id
        - contactName
        - contactPhoneMasked
        - contactRelationship
        - channel
        - status
        - provider
        - sentAt
        - createdAt
        - error
      properties:
        id:
          type: string
          example: 665f1f5d9b1e8a0012a3456a
        contactName:
          type: string
          maxLength: 100
          example: Ravi Rao
        contactPhoneMasked:
          type: string
          pattern: '^\*{6}[0-9]{4}$'
          example: '******3210'
        contactRelationship:
          type: string
          enum: [Family, Friend, Relative, Colleague, Other]
        channel:
          type: string
          enum: [sms]
        status:
          type: string
          enum: [pending, simulated, sent, failed]
          example: simulated
        provider:
          type: string
          example: simulated
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        error:
          type: string
          nullable: true

    SafetyTimer:
      type: object
      required:
        - id
        - status
        - durationMinutes
        - message
        - startedAt
        - expiresAt
        - secondsRemaining
        - checkedInAt
        - expiredAt
        - contactCount
        - sosEventId
      properties:
        id:
          type: string
          example: 665f206e9b1e8a0012a3456b
        status:
          type: string
          enum: [active, checked_in, expired]
          example: active
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          example: 30
        message:
          type: string
          maxLength: 500
          example: Check on me
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        secondsRemaining:
          type: integer
          minimum: 0
          example: 1799
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        expiredAt:
          type: string
          format: date-time
          nullable: true
        contactCount:
          type: integer
          minimum: 0
          example: 2
        sosEventId:
          type: string
          nullable: true
          example: null

    Location:
      type: object
      required: [latitude, longitude, accuracy, recordedAt]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 28.6139
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 77.209
        accuracy:
          type: number
          minimum: 0
          nullable: true
          example: 12.5
        recordedAt:
          type: string
          format: date-time

    LocationShareCreated:
      type: object
      required: [token, path, expiresAt]
      properties:
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        path:
          type: string
          pattern: '^/api/location/share/[a-f0-9]{64}$'
          example: /api/location/share/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        expiresAt:
          type: string
          format: date-time

    Pagination:
      type: object
      required: [page, limit, total, pages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0

    NotificationSummary:
      type: object
      required: [simulated, status, count]
      properties:
        simulated:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [created, failed]
        count:
          type: integer
          minimum: 0

    Error:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
          example: Invalid input
        attemptsRemaining:
          type: integer
          minimum: 0
          maximum: 4
          description: Present on invalid-PIN responses.
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Present when a PIN is locked or a rate limit applies.

    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [status, service, timestamp, uptimeSeconds]
          properties:
            status:
              type: string
              enum: [ok]
            service:
              type: string
              enum: [nirbhayaraksha-backend]
            timestamp:
              type: string
              format: date-time
            uptimeSeconds:
              type: integer
              minimum: 0

    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'

    LoginResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [token, user]
          properties:
